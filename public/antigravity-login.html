<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity — Access Portal</title>
  <meta name="description" content="Antigravity secure access portal. Log in or sign up with your credentials and access token file." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── RESET & TOKENS ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-from:      #0a0f1e;
      --bg-mid:       #0d1b3e;
      --bg-to:        #060c18;

      --glass-bg:     rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glass-shadow: 0 32px 80px rgba(0, 0, 0, 0.55), 0 8px 32px rgba(0, 0, 0, 0.35);

      /* ── SOLID matte palette (NO gradients) ── */
      --clr-primary:   #4f6ef7;     /* solid indigo-blue  */
      --clr-primary-d: #3a56d4;     /* darker on hover    */
      --clr-accent:    #7c3aed;     /* solid violet       */
      --clr-success:   #10b981;     /* solid emerald      */
      --clr-surface:   #131b35;     /* solid dark surface */
      --clr-surface2:  #1a2448;     /* slightly lighter   */
      --clr-border:    #2a3660;     /* solid matte border */

      --txt-primary:   #e8ecf8;
      --txt-secondary: #8b96bb;
      --txt-muted:     #5a6585;

      --radius-sm:  8px;
      --radius-md:  14px;
      --radius-lg:  22px;
      --radius-xl:  32px;

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-display: 'Space Grotesk', system-ui, sans-serif;

      --transition: 0.22s cubic-bezier(.4, 0, .2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      color: var(--txt-primary);
      overflow-x: hidden;
    }

    body {
      /* Smooth multi-stop gradient background */
      background: 
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2456 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, #1a0e36 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #0a0f1e 0%, #060c18 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── SUBTLE BACKGROUND STARS ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 73% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 42% 68%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 44%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 5%  80%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 95% 75%, rgba(255,255,255,0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── HEADER ─────────────────────────────────────────────── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--clr-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--txt-primary);
      letter-spacing: -0.01em;
    }

    .logo-text span {
      color: var(--txt-secondary);
      font-weight: 400;
      font-size: 0.75rem;
      display: block;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* SOLID matte header buttons — no gradients */
    .btn-header {
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      letter-spacing: 0.01em;
    }

    #btn-user-manual {
      background: var(--clr-surface2);
      color: var(--txt-primary);
    }
    #btn-user-manual:hover { background: #22305a; transform: translateY(-1px); }

    #btn-ask-help {
      background: var(--clr-primary);
      color: #fff;
    }
    #btn-ask-help:hover { background: var(--clr-primary-d); transform: translateY(-1px); }

    /* ─── MAIN CONTENT AREA ──────────────────────────────────── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    /* ─── LEVITATING GLASSMORPHISM PANEL ─────────────────────── */
    .glass-panel {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--glass-shadow);
      padding: 40px 40px 36px;
      animation: levitate 5s ease-in-out infinite;
    }

    @keyframes levitate {
      0%   { transform: translateY(0px);   }
      30%  { transform: translateY(-12px);  }
      60%  { transform: translateY(-6px);   }
      80%  { transform: translateY(-14px);  }
      100% { transform: translateY(0px);   }
    }

    /* ─── PANEL HEADER ───────────────────────────────────────── */
    .panel-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .panel-brand-icon {
      width: 56px;
      height: 56px;
      background: var(--clr-primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .panel-brand-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--txt-primary);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .panel-subtitle {
      font-size: 0.85rem;
      color: var(--txt-secondary);
      font-weight: 400;
    }

    /* ─── TOGGLE ─────────────────────────────────────────────── */
    .view-toggle {
      display: flex;
      background: var(--clr-surface);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--clr-border);
    }

    .toggle-btn {
      flex: 1;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      padding: 9px 0;
      border: none;
      border-radius: calc(var(--radius-md) - 2px);
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      background: transparent;
      color: var(--txt-muted);
    }

    .toggle-btn.active {
      background: var(--clr-primary);  /* solid color, no gradient */
      color: #fff;
    }

    .toggle-btn:not(.active):hover {
      color: var(--txt-secondary);
      background: rgba(255,255,255,0.04);
    }

    /* ─── VIEWS ──────────────────────────────────────────────── */
    .view {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .view.active { display: flex; }

    /* ─── FORM FIELDS ────────────────────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--txt-secondary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* SOLID matte input — absolutely no gradient */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--txt-primary);
      background: var(--clr-surface);       /* solid matte */
      border: 1px solid var(--clr-border);  /* solid matte border */
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
      width: 100%;
    }

    input::placeholder { color: var(--txt-muted); }

    input:focus {
      border-color: var(--clr-primary);     /* solid color on focus */
      background: var(--clr-surface2);      /* solid matte on focus */
    }

    /* ─── SUBMIT BUTTONS ─────────────────────────────────────── */
    .btn-submit {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--clr-primary);   /* solid color — NO gradient */
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 0;
      width: 100%;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: var(--clr-primary-d);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 110, 247, 0.35);
    }

    .btn-submit:active { transform: translateY(0); }

    /* ─── DRAG & DROP ZONE ───────────────────────────────────── */
    .drop-zone {
      border: 2px dashed var(--clr-border);  /* solid dashed — no gradient */
      border-radius: var(--radius-md);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition:
        border-color var(--transition),
        background var(--transition);
      background: transparent;
      text-align: center;
      position: relative;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-zone-icon {
      width: 44px;
      height: 44px;
      background: var(--clr-surface2);   /* solid matte */
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
    }

    .drop-zone-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--clr-primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drop-zone-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--txt-primary);
    }

    .drop-zone-sub {
      font-size: 0.78rem;
      color: var(--txt-muted);
    }

    .drop-zone-filename {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--clr-success);
      display: none;
    }

    /* DRAG-OVER STATE — solid background, no gradient */
    .drop-zone.drag-over {
      border-color: var(--clr-primary);
      background: var(--clr-surface2);  /* solid matte highlight */
    }

    .drop-zone.drag-over .drop-zone-icon {
      background: var(--clr-primary);
    }

    .drop-zone.drag-over .drop-zone-icon svg {
      stroke: #fff;
    }

    .drop-zone.drag-over .drop-zone-label {
      color: var(--txt-primary);
    }

    /* File accepted state */
    .drop-zone.file-accepted {
      border-color: var(--clr-success);
      background: rgba(16, 185, 129, 0.07);  /* very subtle solid tint */
    }

    /* ─── DIVIDER ─────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--clr-border);   /* solid color */
      margin: 4px 0;
    }

    /* ─── SECTION LABEL ───────────────────────────────────────── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--txt-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-copy {
      font-size: 0.78rem;
      color: var(--txt-muted);
    }

    .field-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--clr-surface);    /* solid matte pill */
      border: 1px solid var(--clr-border);
      border-radius: 100px;
      padding: 5px 14px 5px 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--clr-success);    /* solid green */
      flex-shrink: 0;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .status-text {
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--txt-secondary);
      letter-spacing: 0.02em;
    }

    .status-badge {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--clr-success);
      background: rgba(16, 185, 129, 0.12);  /* solid tint */
      border-radius: 4px;
      padding: 1px 6px;
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 14px 20px; }
      footer  { padding: 12px 20px; }
      .glass-panel { padding: 30px 24px 28px; }
      .header-actions .btn-header:first-child { display: none; }
      .panel-title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header>
    <a class="logo" href="#" id="logo-link" aria-label="Antigravity Home">
      <div class="logo-icon" aria-hidden="true">
        <!-- Orbit/atom icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(0 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>
        </svg>
      </div>
      <div class="logo-text">
        Antigravity
        <span>System Access Portal</span>
      </div>
    </a>

    <div class="header-actions">
      <button class="btn-header" id="btn-user-manual" type="button">User Manual</button>
      <button class="btn-header" id="btn-ask-help"    type="button">Ask for Help</button>
    </div>
  </header>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main>
    <div class="glass-panel" id="glass-panel" role="region" aria-label="Authentication Panel">

      <!-- Panel branding -->
      <div class="panel-brand">
        <div class="panel-brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <ellipse cx="12" cy="12" rx="10" ry="4"/>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>
          </svg>
        </div>
        <h1 class="panel-title">Welcome Back</h1>
        <p class="panel-subtitle">Antigravity — Secure Access Portal</p>
      </div>

      <!-- View toggle -->
      <div class="view-toggle" role="tablist" aria-label="Authentication mode">
        <button
          class="toggle-btn active"
          id="tab-login"
          role="tab"
          aria-selected="true"
          aria-controls="view-login"
          type="button"
          onclick="switchView('login')"
        >Log In</button>
        <button
          class="toggle-btn"
          id="tab-signup"
          role="tab"
          aria-selected="false"
          aria-controls="view-signup"
          type="button"
          onclick="switchView('signup')"
        >Sign Up</button>
      </div>

      <!-- ─── LOGIN VIEW ─────────────────────────── -->
      <div class="view active" id="view-login" role="tabpanel" aria-labelledby="tab-login">

        <div class="field">
          <label for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            name="login-email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="login-password"
            placeholder="••••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="btn-submit" id="btn-login" type="button" onclick="handleLogin()">
          Log In
        </button>

      </div>

      <!-- ─── SIGN UP VIEW ───────────────────────── -->
      <div class="view" id="view-signup" role="tabpanel" aria-labelledby="tab-signup">

        <div class="field">
          <label for="signup-name">Full Name</label>
          <input
            type="text"
            id="signup-name"
            name="signup-name"
            placeholder="Ada Lovelace"
            autocomplete="name"
            required
          />
        </div>

        <div class="field">
          <label for="signup-email">Email Address</label>
          <input
            type="email"
            id="signup-email"
            name="signup-email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="divider"></div>

        <!-- Drag & Drop Zone -->
        <p class="section-label">Access Token File</p>

        <div
          class="drop-zone"
          id="drop-zone"
          role="button"
          tabindex="0"
          aria-label="Drag and drop your access token file here, or click to browse"
        >
          <!-- Hidden file input for click-to-browse -->
          <input
            type="file"
            id="token-file-input"
            name="access-token"
            accept=".token,.json,.key,.pem,.txt"
            tabindex="-1"
            aria-hidden="true"
          />

          <div class="drop-zone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>

          <p class="drop-zone-label">Drag &amp; Drop your Access Token File here</p>
          <p class="drop-zone-sub">or click to browse — .token .json .key .pem</p>
          <p class="drop-zone-filename" id="drop-zone-filename" aria-live="polite"></p>
        </div>

        <button class="btn-submit" id="btn-signup" type="button" onclick="handleSignUp()">
          Create Account
        </button>

      </div>
      <!-- end views -->

    </div>
    <!-- end glass-panel -->
  </main>

  <!-- ═══════════════ FOOTER ═══════════════ -->
  <footer>
    <p class="footer-copy" id="footer-copyright">
      &copy; <span id="footer-year"></span> Antigravity Systems. All rights reserved.
    </p>

    <div class="field-status" id="field-status" aria-label="Antigravity Field Status">
      <div class="status-dot" aria-hidden="true"></div>
      <span class="status-text">Antigravity Field Status</span>
      <span class="status-badge" id="status-badge">NOMINAL</span>
    </div>
  </footer>

  <!-- ═══════════════ JAVASCRIPT ═══════════════ -->
  <script>
    'use strict';

    /* ── Year ──────────────────────────────── */
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    /* ── View Toggle ───────────────────────── */
    function switchView(view) {
      const isLogin  = view === 'login';
      const tabLogin = document.getElementById('tab-login');
      const tabSign  = document.getElementById('tab-signup');
      const vLogin   = document.getElementById('view-login');
      const vSign    = document.getElementById('view-signup');
      const title    = document.querySelector('.panel-title');
      const sub      = document.querySelector('.panel-subtitle');

      tabLogin.classList.toggle('active', isLogin);
      tabSign.classList.toggle('active', !isLogin);
      tabLogin.setAttribute('aria-selected', String(isLogin));
      tabSign.setAttribute('aria-selected',  String(!isLogin));

      vLogin.classList.toggle('active', isLogin);
      vSign.classList.toggle('active', !isLogin);

      title.textContent = isLogin ? 'Welcome Back'     : 'Create Account';
      sub.textContent   = isLogin
        ? 'Antigravity — Secure Access Portal'
        : 'Join the Antigravity Network';
    }

    /* ── Drag & Drop ───────────────────────── */
    const dropZone     = document.getElementById('drop-zone');
    const fileInput    = document.getElementById('token-file-input');
    const fileLabel    = document.getElementById('drop-zone-filename');
    const dropSubText  = dropZone.querySelector('.drop-zone-sub');
    const dropMainText = dropZone.querySelector('.drop-zone-label');

    function setAccepted(file) {
      dropZone.classList.remove('drag-over');
      dropZone.classList.add('file-accepted');
      fileLabel.style.display  = 'block';
      fileLabel.textContent    = `✓  ${file.name}  (${formatBytes(file.size)})`;
      dropMainText.textContent = 'Token file attached';
      dropSubText.textContent  = 'Click to replace';
    }

    function formatBytes(bytes) {
      if (bytes < 1024)       return bytes + ' B';
      if (bytes < 1048576)    return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    /* Drag events */
    dropZone.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', (e) => {
      // Only remove if cursor left the zone entirely
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) setAccepted(file);
    });

    /* Click to browse */
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) setAccepted(file);
    });

    /* Keyboard accessibility */
    dropZone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    /* ── Handlers (stub) ────────────────────── */
    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-password').value.trim();
      if (!email || !pass) {
        alert('Please enter your email and password.');
        return;
      }
      // TODO: wire to API
      console.log('[Antigravity] Login attempt:', email);
    }

    function handleSignUp() {
      const name  = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const file  = fileInput.files[0];
      if (!name || !email) {
        alert('Please fill in your name and email.');
        return;
      }
      if (!file) {
        alert('Please provide your Access Token File.');
        return;
      }
      // TODO: wire to API
      console.log('[Antigravity] Sign up attempt:', name, email, file.name);
    }

    /* ── Header button stubs ──────────────── */
    document.getElementById('btn-user-manual').addEventListener('click', () => {
      console.log('[Antigravity] Opening User Manual…');
    });
    document.getElementById('btn-ask-help').addEventListener('click', () => {
      console.log('[Antigravity] Opening Help…');
    });
  </script>
